{% extends "base.html" %}

{% block window_title %}Sign In - Draft Mode{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <h2 style="margin-bottom: 20px;">Sign In</h2>
    
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <div style="margin-top: 4px;">
                <a href="{{ url_for('auth.forgot_password') }}" style="font-size: 10px; color: var(--accent-green); text-decoration: none;">
                    Forgot password?
                </a>
            </div>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 8px;">
            <button type="submit" class="btn primary">Sign In</button>
            <a href="{{ url_for("auth.signup") }}" class="btn">Create Account</a>
        </div>
    </form>
</div>
{% endblock %}
