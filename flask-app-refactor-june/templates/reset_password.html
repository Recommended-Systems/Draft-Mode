{% extends "base.html" %}

{% block window_title %}Reset Password - Draft Mode{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <h2 style="margin-bottom: 20px;">Reset Password</h2>

    <p style="color: var(--text-secondary); font-size: 12px; margin-bottom: 20px;">
        Enter your new password below.
    </p>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" required autofocus>
            <div style="font-size: 10px; color: var(--text-muted); margin-top: 4px;">
                Minimum 8 characters with uppercase, lowercase, number, and special character
            </div>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 8px;">
            <button type="submit" class="btn primary">Reset Password</button>
            <a href="{{ url_for('auth.login') }}" class="btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
