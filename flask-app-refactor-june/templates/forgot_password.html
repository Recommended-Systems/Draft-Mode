{% extends "base.html" %}

{% block window_title %}Forgot Password - Draft Mode{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <h2 style="margin-bottom: 20px;">Forgot Password</h2>

    <p style="color: var(--text-secondary); font-size: 12px; margin-bottom: 20px;">
        Enter your email address and we'll send you instructions to reset your password.
    </p>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 8px;">
            <button type="submit" class="btn primary">Send Reset Link</button>
            <a href="{{ url_for('auth.login') }}" class="btn">Back to Login</a>
        </div>
    </form>
</div>
{% endblock %}
