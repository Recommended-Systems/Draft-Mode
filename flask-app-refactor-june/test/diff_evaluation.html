<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diff Algorithm Evaluation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .controls {
            background: #2a2a2a;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 2px solid #4CAF50;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #4CAF50;
            font-weight: bold;
        }

        select, button {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        select {
            width: 300px;
        }

        button {
            background: #4CAF50;
            color: white;
            font-weight: bold;
            margin-left: 10px;
        }

        button:hover {
            background: #45a049;
        }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .algorithm-result {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #555;
        }

        .algorithm-result h2 {
            color: #4CAF50;
            margin-bottom: 10px;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats {
            font-size: 11px;
            color: #999;
        }

        .diff-output {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #333;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .added {
            background: rgba(76, 175, 80, 0.3);
            color: #a5d6a7;
        }

        .removed {
            background: rgba(244, 67, 54, 0.3);
            color: #ef9a9a;
        }

        .modified {
            background: rgba(255, 193, 7, 0.3);
            color: #fff59d;
        }

        .moved {
            background: rgba(33, 150, 243, 0.3);
            color: #90caf9;
        }

        .diff-line {
            padding: 2px 0;
            display: block;
        }

        .line-number {
            display: inline-block;
            width: 50px;
            color: #666;
            text-align: right;
            padding-right: 10px;
            user-select: none;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #555;
        }

        .metric-card h3 {
            color: #4CAF50;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .winner {
            border-color: #FFD700;
        }

        .winner h2::after {
            content: " 🏆";
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Diff Algorithm Evaluation Suite</h1>

        <div class="controls">
            <div class="control-group">
                <label for="testCase">Select Test Case:</label>
                <select id="testCase">
                    <option value="technical">Technical Blog Post (Section Reordering + Typos)</option>
                    <option value="creative">Creative Writing (Paragraph Merging + Word Changes)</option>
                    <option value="documentation">Documentation (Structural Changes + Code)</option>
                </select>
                <button onclick="runComparison()">Run Comparison</button>
            </div>
        </div>

        <div id="metricsContainer"></div>
        <div id="resultsContainer"></div>
    </div>

    <!-- Include diff libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js"></script>

    <script>
        // Test data
        const testCases = {
            technical: {
                name: "Technical Blog Post",
                v1: null, // Will be loaded
                v2: null
            },
            creative: {
                name: "Creative Writing",
                v1: null,
                v2: null
            },
            documentation: {
                name: "Documentation",
                v1: null,
                v2: null
            }
        };

        // Load test files
        async function loadTestCase(caseName) {
            const v1Response = await fetch(`diff_samples/${caseName}_v1.md`);
            const v2Response = await fetch(`diff_samples/${caseName}_v2.md`);

            testCases[caseName].v1 = await v1Response.text();
            testCases[caseName].v2 = await v2Response.text();
        }

        // Algorithm implementations
        const algorithms = {
            // 1. Current implementation (custom line-based)
            current: {
                name: "Current Implementation",
                description: "Custom line-based LCS with word-level diff",
                run: function(text1, text2) {
                    const start = performance.now();
                    const result = currentImplementation(text1, text2);
                    const time = performance.now() - start;
                    return { result, time };
                }
            },

            // 2. Google's diff-match-patch
            diffMatchPatch: {
                name: "diff-match-patch",
                description: "Google's semantic diff with move detection",
                run: function(text1, text2) {
                    const start = performance.now();
                    const dmp = new diff_match_patch();
                    dmp.Diff_Timeout = 1;
                    dmp.Diff_EditCost = 4;

                    const diffs = dmp.diff_main(text1, text2);
                    dmp.diff_cleanupSemantic(diffs);

                    const result = formatDiffMatchPatch(diffs);
                    const time = performance.now() - start;
                    return { result, time };
                }
            },

            // 3. jsdiff (multiple strategies)
            jsdiffLines: {
                name: "jsdiff (Lines)",
                description: "Line-based diff from jsdiff library",
                run: function(text1, text2) {
                    const start = performance.now();
                    const diffs = Diff.diffLines(text1, text2);
                    const result = formatJSDiff(diffs);
                    const time = performance.now() - start;
                    return { result, time };
                }
            },

            jsdiffWords: {
                name: "jsdiff (Words)",
                description: "Word-based diff from jsdiff library",
                run: function(text1, text2) {
                    const start = performance.now();
                    const diffs = Diff.diffWords(text1, text2);
                    const result = formatJSDiffWords(diffs);
                    const time = performance.now() - start;
                    return { result, time };
                }
            },

            jsdiffSentences: {
                name: "jsdiff (Sentences)",
                description: "Sentence-based diff from jsdiff library",
                run: function(text1, text2) {
                    const start = performance.now();
                    const diffs = Diff.diffSentences(text1, text2);
                    const result = formatJSDiff(diffs);
                    const time = performance.now() - start;
                    return { result, time };
                }
            },

            // 4. Hybrid approach
            hybrid: {
                name: "Hybrid Approach",
                description: "Smart combination of line/word/char diff",
                run: function(text1, text2) {
                    const start = performance.now();
                    const result = hybridDiff(text1, text2);
                    const time = performance.now() - start;
                    return { result, time };
                }
            }
        };

        // Current implementation (from compare.html)
        function currentImplementation(text1, text2) {
            const lines1 = text1.split('\n');
            const lines2 = text2.split('\n');

            let output = '';
            let additions = 0, deletions = 0, modifications = 0;

            const maxLen = Math.max(lines1.length, lines2.length);
            for (let i = 0; i < maxLen; i++) {
                const line1 = lines1[i] || '';
                const line2 = lines2[i] || '';

                if (line1 === line2) {
                    output += `<span class="diff-line">${escapeHtml(line1)}</span>\n`;
                } else if (!line1) {
                    output += `<span class="diff-line added">+ ${escapeHtml(line2)}</span>\n`;
                    additions++;
                } else if (!line2) {
                    output += `<span class="diff-line removed">- ${escapeHtml(line1)}</span>\n`;
                    deletions++;
                } else {
                    output += `<span class="diff-line modified">~ ${escapeHtml(line2)}</span>\n`;
                    modifications++;
                }
            }

            return { html: output, stats: { additions, deletions, modifications } };
        }

        // diff-match-patch formatter
        function formatDiffMatchPatch(diffs) {
            let output = '';
            let additions = 0, deletions = 0, modifications = 0;

            for (const [op, text] of diffs) {
                const lines = text.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i] === '' && i === lines.length - 1) continue;

                    if (op === 1) { // Insert
                        output += `<span class="diff-line added">+ ${escapeHtml(lines[i])}</span>\n`;
                        additions++;
                    } else if (op === -1) { // Delete
                        output += `<span class="diff-line removed">- ${escapeHtml(lines[i])}</span>\n`;
                        deletions++;
                    } else { // Equal
                        output += `<span class="diff-line">${escapeHtml(lines[i])}</span>\n`;
                    }
                }
            }

            return { html: output, stats: { additions, deletions, modifications } };
        }

        // jsdiff formatter (line-based)
        function formatJSDiff(diffs) {
            let output = '';
            let additions = 0, deletions = 0;

            for (const diff of diffs) {
                const lines = diff.value.split('\n').filter(l => l !== '');
                for (const line of lines) {
                    if (diff.added) {
                        output += `<span class="diff-line added">+ ${escapeHtml(line)}</span>\n`;
                        additions++;
                    } else if (diff.removed) {
                        output += `<span class="diff-line removed">- ${escapeHtml(line)}</span>\n`;
                        deletions++;
                    } else {
                        output += `<span class="diff-line">${escapeHtml(line)}</span>\n`;
                    }
                }
            }

            return { html: output, stats: { additions, deletions, modifications: 0 } };
        }

        // jsdiff word formatter
        function formatJSDiffWords(diffs) {
            let output = '<span class="diff-line">';
            let additions = 0, deletions = 0;

            for (const diff of diffs) {
                if (diff.added) {
                    output += `<span class="added">${escapeHtml(diff.value)}</span>`;
                    additions++;
                } else if (diff.removed) {
                    output += `<span class="removed">${escapeHtml(diff.value)}</span>`;
                    deletions++;
                } else {
                    output += escapeHtml(diff.value);
                }
            }

            output += '</span>';
            return { html: output, stats: { additions, deletions, modifications: 0 } };
        }

        // Hybrid approach - intelligent switching between algorithms
        function hybridDiff(text1, text2) {
            const lines1 = text1.split('\n');
            const lines2 = text2.split('\n');

            // Use jsdiff for line-level comparison
            const lineDiffs = Diff.diffLines(text1, text2);

            let output = '';
            let additions = 0, deletions = 0, modifications = 0;

            for (const diff of lineDiffs) {
                const lines = diff.value.split('\n').filter((l, i, arr) =>
                    l !== '' || i < arr.length - 1
                );

                for (const line of lines) {
                    if (diff.added) {
                        output += `<span class="diff-line added">+ ${escapeHtml(line)}</span>\n`;
                        additions++;
                    } else if (diff.removed) {
                        output += `<span class="diff-line removed">- ${escapeHtml(line)}</span>\n`;
                        deletions++;
                    } else {
                        output += `<span class="diff-line">${escapeHtml(line)}</span>\n`;
                    }
                }
            }

            return { html: output, stats: { additions, deletions, modifications } };
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function runComparison() {
            const testCase = document.getElementById('testCase').value;

            // Load test case if not loaded
            if (!testCases[testCase].v1) {
                await loadTestCase(testCase);
            }

            const text1 = testCases[testCase].v1;
            const text2 = testCases[testCase].v2;

            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '<div class="loading">Running comparisons...</div>';

            // Run all algorithms
            const results = {};
            for (const [key, algo] of Object.entries(algorithms)) {
                results[key] = algo.run(text1, text2);
                results[key].name = algo.name;
                results[key].description = algo.description;
            }

            // Display results
            displayResults(results, testCases[testCase].name);
        }

        function displayResults(results, testName) {
            const metricsContainer = document.getElementById('metricsContainer');
            const resultsContainer = document.getElementById('resultsContainer');

            // Calculate winner based on performance and accuracy
            let bestScore = -1;
            let winner = null;

            for (const [key, result] of Object.entries(results)) {
                const score = calculateScore(result);
                if (score > bestScore) {
                    bestScore = score;
                    winner = key;
                }
            }

            // Display metrics
            metricsContainer.innerHTML = `
                <div class="metric-card">
                    <h3>Test Case</h3>
                    <div class="metric-value">${testName}</div>
                </div>
                <div class="metric-card">
                    <h3>Algorithms Tested</h3>
                    <div class="metric-value">${Object.keys(results).length}</div>
                </div>
                <div class="metric-card">
                    <h3>Best Performer</h3>
                    <div class="metric-value" style="font-size: 16px;">${results[winner].name}</div>
                </div>
            `;

            // Display algorithm results
            let html = '<div class="results">';
            for (const [key, result] of Object.entries(results)) {
                const isWinner = key === winner;
                html += `
                    <div class="algorithm-result ${isWinner ? 'winner' : ''}">
                        <h2>
                            ${result.name}
                            <span class="stats">
                                ⏱️ ${result.time.toFixed(2)}ms |
                                ➕ ${result.result.stats.additions} |
                                ➖ ${result.result.stats.deletions} |
                                ✏️ ${result.result.stats.modifications}
                            </span>
                        </h2>
                        <p style="color: #999; font-size: 11px; margin-bottom: 10px;">${result.description}</p>
                        <div class="diff-output">${result.result.html}</div>
                    </div>
                `;
            }
            html += '</div>';

            resultsContainer.innerHTML = html;
        }

        function calculateScore(result) {
            // Lower time is better
            const timeScore = Math.max(0, 100 - result.time);

            // More granular changes detected is generally better
            const changesScore = (result.result.stats.additions +
                                 result.result.stats.deletions +
                                 result.result.stats.modifications * 1.5);

            return timeScore + changesScore;
        }

        // Load first test case on page load
        window.onload = function() {
            loadTestCase('technical').then(() => {
                console.log('Test cases loaded');
            });
        };
    </script>
</body>
</html>
